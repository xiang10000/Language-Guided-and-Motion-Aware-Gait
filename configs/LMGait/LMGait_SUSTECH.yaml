data_cfg:
  dataset_name: SUSTech1K
  dataset_root: dataset/SUSTech1K-RGB-pkl # use datasets/pretreatment_rgb.py for data preprocessing!
  dataset_partition: datasets/SUSTech1K/SUSTech1K.json
  data_in_use: [True, True] # images / real_ratios
  num_workers: 8
  remove_no_gallery: false # Remove probe if no gallery for it
  test_dataset_name: SUSTech1K

evaluator_cfg:
  enable_float16: true
  restore_ckpt_strict: True
  restore_hint: 40000
  save_name: LMGait
  eval_func: evaluate_indoor_dataset
  sampler:
    batch_shuffle: false
    batch_size: 6 # GPUs number
    sample_type: all_ordered # all indicates whole sequence used to test, while ordered means input sequence by its natural order; Other options:   fixed_unordered
    frames_all_limit: 250 # limit the number of sampled frames to prevent out of memory
  metric: euc # cos
  transform:
    - type: BaseRgbTransform
    - type: NoOperation

loss_cfg:
  - loss_term_weight: 1.0
    margin: 0.2
    type: TripletLoss
    log_prefix: triplet
  - loss_term_weight: 1.0
    scale: 16
    type: CrossEntropyLoss
    log_prefix: softmax
    log_accuracy: true

model_cfg:
  model: LMGait
  pretrained_dinov2: pretrained_model/dinov2_vits14_pretrain.pth                  # DINOv2 Download Link: https://dl.fbaipublicfiles.com/dinov2/dinov2_vits14/dinov2_vits14_pretrain.pth
  pretrained_mask_branch: pretrained_model/MaskBranch_vits14.pt
  image_size: 224                                                               # 448x224
  sils_size: 32                                                                 # 64x32
  dataset_partition: datasets/SUSTech1K/SUSTech1K.json
  CLIP_Branch:
    embed_dim: 512
    image_resolution: 224
    vision_patch_size: 16
    vision_width: 768
    vision_layers: 12
    vision_adapter_width: 384
    vision_adapter_layers: 12
    vision_adapter_kernel_size: (3, 1, 1)
    vision_adapter_pre_attn: True
    vision_adapter_pre_mlp: True
    context_length: 77
    vocab_size: 49408
    transformer_width: 512
    transformer_heads: 8
    transformer_layers: 13
    text_adapter_width: 384
    text_adapter_layers: 13
    text_adapter_kernel_size: (3, 1, 1)
    text_adapter_pre_attn: False
    text_adapter_pre_mlp: True                                                               # 64x32
    num_classes: 100
    num_frames: 0
    mlm_head_len: 10
  
  Adapter:
    in_channels: 768
    adapter_channels: 64
    kernel_size: 3
    T: 24
    B: 1

  Denoising_Branch:
    source_dim: 1536
    target_dim: 16
    p: 0
    softmax: True
    Relu: True
    Up: False

  Appearance_Branch:
    source_dim: 1536
    target_dim: 16
    p: 0
    softmax: False
    Relu: False
    Up: False

  Mask_Branch:
    source_dim: 384
    target_dim: 2
    p: 0.5
    softmax: True
    Relu: False
    Up: True

  AttentionFusion:
    in_channels: 64
    squeeze_ratio: 16
    feat_len: 2

  backbone_cfg:
    type: ResNet9
    block: BasicBlock
    in_channel: 1
    channels: # Layers configuration for automatically model construction
      - 64
      - 128
      - 256
      - 512
    layers:
      - 1
      - 1
      - 1
      - 1
    strides:
      - 1
      - 2
      - 2
      - 1
    maxpool: false
  SeparateFCs:
    in_channels: 512
    out_channels: 256
    parts_num: 16
  SeparateBNNecks:
    class_num: 250
    in_channels: 256
    parts_num: 16
  bin_num:
    - 16

optimizer_cfg:
  lr: 0.1
  momentum: 0.9
  solver: SGD
  weight_decay: 0.0005

scheduler_cfg:
  gamma: 0.1
  milestones: # Learning Rate Reduction at each milestones
    - 15000
    - 25000
    - 30000
    - 35000
  scheduler: MultiStepLR


trainer_cfg:
  find_unused_parameters: True
  enable_float16: true # half_percesion float for memory reduction and speedup
  fix_BN: false
  log_iter: 100
  with_test: false
  restore_ckpt_strict: true
  restore_hint: 0
  save_iter: 5000
  save_name: LMGait
  sync_BN: true
  total_iter: 40000
  sampler:
    batch_shuffle: true
    batch_size:
      - 6 # TripletSampler, batch_size[0] indicates Number of Identity #TODO::6!!!!!!!!!!!!!!!!!!!!!!
      - 8 #                 batch_size[1] indicates Samples sequqnce for each Identity
    frames_num_fixed: 24 # fixed frames number for training
    frames_skip_num: 4
    frames_num_max: 40 # max frames number for unfixed training
    frames_num_min: 20 # min frames number for unfixed traing
    sample_type: fixed_unordered # fixed control input frames number, unordered for controlling order of input tensor; Other options: unfixed_ordered or all_ordered
    type: TripletSampler
  transform:
    - type: Compose
      trf_cfg:
        - type: RandomHorizontalFlip
        - type: BaseRgbTransform
    - type: NoOperation
